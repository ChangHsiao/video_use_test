[project]
name = "video-use"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    "jieba>=0.42.1",
    "opencc>=1.4.2",
    "budoux>=0.9",
    "yt-dlp>=2026.10.21",
]

[project.optional-dependencies]
animations = ["manim"]
# news shorts: face framing in news_short.py, breath editing in prosody.py / signoff.py
news = ["opencv-python-headless>=4.8,<5", "soundfile"]  # OpenCV 5 dropped the Haar face cascades news_short.py uses

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

# helpers/ are run as scripts, not imported as a package: uv only installs the dependencies and
# does not build the project (no video_use.egg-info appearing after every uv run)
[tool.uv]
package = false
